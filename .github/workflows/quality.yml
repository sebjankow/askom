name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: HTML & CSS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: HTMLHint
        run: npx --yes htmlhint@1 "*.html"
      - name: Stylelint
        run: |
          echo '{"extends":"stylelint-config-standard","rules":{"declaration-block-single-line-max-declarations":null,"selector-class-pattern":null,"alpha-value-notation":null,"color-function-notation":null,"value-keyword-case":null,"comment-empty-line-before":null,"rule-empty-line-before":null,"declaration-empty-line-before":null,"shorthand-property-no-redundant-values":null,"property-no-vendor-prefix":null}}' > /tmp/stylelintrc.json
          npx --yes -p stylelint@16 -p stylelint-config-standard@36 stylelint --config /tmp/stylelintrc.json "style.css"

  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
